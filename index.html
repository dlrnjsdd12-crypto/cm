<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>고객사 점검 관리</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&family=Noto+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #122234;
    --navy-deep: #0B1826;
    --navy-line: #3C6C88;
    --paper: #FBF9F3;
    --paper-dim: #F2EEE2;
    --ink: #1A2420;
    --ink-soft: #5C665F;
    --line: #DAD3BF;
    --safety: #C1541E;
    --safety-dim: #F4E2D4;
    --ok: #2B6E55;
    --ok-dim: #E3ECE6;
    --amber: #93711E;
    --amber-dim: #EFE7CC;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--navy-deep);
    color: var(--ink);
    font-family: "Noto Sans KR", -apple-system, "Malgun Gothic", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .shell {
    display: flex;
    min-height: 100vh;
  }

  /* ---------------- Sidebar ---------------- */
  .sidebar {
    width: 210px;
    flex-shrink: 0;
    background: var(--navy);
    background-image:
      linear-gradient(var(--navy) 0%, var(--navy) 100%),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 28px),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 28px);
    padding: 26px 0 20px;
    display: flex;
    flex-direction: column;
  }
  .brand {
    padding: 0 22px 22px;
    border-bottom: 1px solid rgba(255,255,255,0.12);
    margin-bottom: 6px;
  }
  .brand .mark {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    color: #7FA8C2;
    margin-bottom: 8px;
  }
  .brand h1 {
    font-family: "Noto Serif KR", serif;
    font-size: 19px;
    color: #F4F1E6;
    margin: 0;
    line-height: 1.35;
    font-weight: 700;
  }

  .tab-rail { display: flex; flex-direction: column; margin-top: 10px; }
  .tab-btn {
    appearance: none; background: none; border: none;
    text-align: left;
    font-family: "Noto Sans KR", sans-serif;
    color: #A9B9C4;
    font-size: 14.5px;
    padding: 14px 22px;
    cursor: pointer;
    border-left: 3px solid transparent;
    position: relative;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .tab-btn .num {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    color: #5A7488;
  }
  .tab-btn:hover { color: #F4F1E6; background: rgba(255,255,255,0.03); }
  .tab-btn.active {
    color: #F4F1E6;
    background: rgba(255,255,255,0.05);
    border-left-color: #E8873F;
  }
  .tab-btn.active .num { color: #E8873F; }

  .sidebar-foot {
    margin-top: auto;
    padding: 16px 22px 0;
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    color: #4F6478;
    border-top: 1px solid rgba(255,255,255,0.1);
  }

  /* ---------------- Main ---------------- */
  .main {
    flex: 1;
    background: var(--paper);
    padding: 34px 40px 60px;
    min-width: 0;
  }

  .page-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 26px;
  }
  .page-head h2 {
    font-family: "Noto Serif KR", serif;
    font-size: 22px;
    margin: 0;
    font-weight: 700;
  }
  .page-head .meta {
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    color: var(--ink-soft);
  }

  .panel { display: none; }
  .panel.active { display: block; }

  /* corner-bracket card motif */
  .doc-card {
    position: relative;
    background: #fff;
    border: 1px solid var(--line);
    padding: 20px;
  }
  .doc-card::before, .doc-card::after,
  .doc-card .bl, .doc-card .br {
    content: ''; position: absolute; width: 10px; height: 10px;
    border-color: var(--navy-line);
  }
  .doc-card::before { top: -1px; left: -1px; border-top: 2px solid var(--navy-line); border-left: 2px solid var(--navy-line); }
  .doc-card::after { top: -1px; right: -1px; border-top: 2px solid var(--navy-line); border-right: 2px solid var(--navy-line); }
  .doc-card .bl { bottom: -1px; left: -1px; border-bottom: 2px solid var(--navy-line); border-left: 2px solid var(--navy-line); }
  .doc-card .br { bottom: -1px; right: -1px; border-bottom: 2px solid var(--navy-line); border-right: 2px solid var(--navy-line); }

  /* ---------------- Map panel ---------------- */
  #map { height: 500px; }
  .map-legend {
    display: flex; gap: 20px; margin-top: 12px;
    font-family: "IBM Plex Mono", monospace; font-size: 11.5px; color: var(--ink-soft);
  }
  .map-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

  /* ---------------- Month panel ---------------- */
  .month-picker {
    display: flex; align-items: center; gap: 14px; margin-bottom: 20px;
  }
  .month-picker button {
    border: 1px solid var(--line); background: #fff; color: var(--ink);
    width: 30px; height: 30px; cursor: pointer; font-size: 15px; line-height: 1;
  }
  .month-picker button:hover { border-color: var(--navy-line); color: var(--navy-line); }
  .month-label {
    font-family: "Noto Serif KR", serif;
    font-size: 19px;
    min-width: 130px;
  }

  .visit-row {
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 3px 18px;
    align-items: center;
    padding: 14px 4px;
    border-bottom: 1px solid var(--line);
  }
  .visit-row .name { font-weight: 700; font-size: 15px; }
  .visit-row .addr { font-size: 12.5px; color: var(--ink-soft); grid-column: 1; }
  .badge {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    padding: 3px 9px;
    white-space: nowrap;
    justify-self: end;
    border: 1px solid transparent;
  }
  .badge.monthly { background: var(--ok-dim); color: var(--ok); border-color: rgba(43,110,85,0.25); }
  .badge.quarterly { background: var(--amber-dim); color: var(--amber); border-color: rgba(147,113,30,0.25); }
  .badge.biannual { background: var(--safety-dim); color: var(--safety); border-color: rgba(193,84,30,0.25); }
  .due-date { font-family: "IBM Plex Mono", monospace; font-size: 12.5px; color: var(--ink-soft); justify-self: end; }
  .empty-state {
    padding: 44px 10px; text-align: center; color: var(--ink-soft); font-size: 14px;
    border: 1px dashed var(--line);
  }

  /* ---------------- Manage panel ---------------- */
  .settings-card { margin-bottom: 18px; }
  .settings-card summary {
    cursor: pointer; font-family: "IBM Plex Mono", monospace; font-size: 12px;
    color: var(--navy-line); list-style: none; user-select: none;
  }
  .settings-card summary::-webkit-details-marker { display: none; }
  .settings-card summary::before { content: '▸ '; }
  .settings-card[open] summary::before { content: '▾ '; }
  .settings-body { margin-top: 14px; }
  .settings-desc { font-size: 12.5px; color: var(--ink-soft); margin: 0 0 10px; line-height: 1.6; }
  .settings-status { font-size: 12px; margin-top: 8px; font-family: "IBM Plex Mono", monospace; }
  .settings-status.ok { color: var(--ok); }
  .settings-status.warn { color: var(--safety); }

  .form-card { margin-bottom: 26px; }
  .form-card h3 {
    font-family: "Noto Serif KR", serif;
    font-size: 15.5px; margin: 0 0 18px; font-weight: 700;
  }
  .form-grid {
    display: grid;
    grid-template-columns: 1.3fr 1fr 1fr;
    gap: 14px 16px;
  }
  .field.full { grid-column: 1 / -1; }
  .field label {
    display: block; font-family: "IBM Plex Mono", monospace; font-size: 11px;
    color: var(--ink-soft); margin-bottom: 6px; letter-spacing: 0.02em;
  }
  .field .row { display: flex; gap: 8px; }
  .field input, .field select {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid var(--line);
    background: var(--paper-dim);
    font-family: "Noto Sans KR", sans-serif;
    font-size: 13.5px;
    color: var(--ink);
  }
  .field input:focus, .field select:focus { outline: none; border-color: var(--navy-line); }
  .btn-outline {
    border: 1px solid var(--navy-line); background: #fff; color: var(--navy);
    padding: 0 14px; font-size: 12.5px; cursor: pointer; font-family: "Noto Sans KR", sans-serif;
    white-space: nowrap;
  }
  .btn-outline:hover { background: var(--navy); color: #fff; }

  .preview-wrap { grid-column: 1 / -1; display: none; }
  .preview-wrap.show { display: block; }
  .preview-status {
    font-size: 12.5px; color: var(--ink-soft); margin-bottom: 8px;
  }
  .preview-status.warn { color: var(--safety); }
  .preview-status.ok { color: var(--ok); }
  #previewMap { height: 220px; border: 1px solid var(--line); }
  .preview-hint {
    font-size: 11.5px; color: var(--ink-soft); margin-top: 6px; font-family: "IBM Plex Mono", monospace;
  }

  .form-actions { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; margin-top: 4px; }
  .btn-primary {
    background: var(--navy); color: #F4F1E6; border: none;
    padding: 10px 20px; font-size: 13.5px; cursor: pointer; font-family: "Noto Sans KR", sans-serif; font-weight: 500;
  }
  .btn-primary:hover:not(:disabled) { background: var(--safety); }
  .btn-primary:disabled { background: #C7C1B0; cursor: default; }
  .btn-text {
    border: none; background: none; color: var(--ink-soft); cursor: pointer;
    font-size: 12.5px; font-family: "Noto Sans KR", sans-serif; text-decoration: underline;
  }
  .form-msg { font-size: 12.5px; color: var(--ink-soft); }
  .form-msg.error { color: var(--safety); }

  .client-table { width: 100%; border-collapse: collapse; margin-top: 4px; }
  .client-table th {
    text-align: left; font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--ink-soft);
    font-weight: 500; padding: 9px 10px; border-bottom: 1px solid var(--ink);
  }
  .client-table td {
    padding: 12px 10px; border-bottom: 1px solid var(--line); font-size: 13.5px; vertical-align: top;
  }
  .client-table tr:last-child td { border-bottom: none; }
  .row-name { font-weight: 700; }
  .row-addr { color: var(--ink-soft); font-size: 12px; margin-top: 2px; }
  .icon-btn {
    border: none; background: none; cursor: pointer; color: var(--ink-soft);
    font-size: 12.5px; padding: 2px 6px; font-family: "Noto Sans KR", sans-serif;
  }
  .icon-btn:hover { color: var(--safety); }
  .icon-btn.edit:hover { color: var(--ok); }

  /* mobile */
  @media (max-width: 760px) {
    .shell { flex-direction: column; }
    .sidebar { width: 100%; flex-direction: row; align-items: center; padding: 14px 10px; overflow-x: auto; }
    .brand { display: none; }
    .tab-rail { flex-direction: row; margin-top: 0; }
    .tab-btn { border-left: none; border-bottom: 3px solid transparent; padding: 8px 14px; white-space: nowrap; }
    .tab-btn.active { border-left-color: transparent; border-bottom-color: #E8873F; }
    .sidebar-foot { display: none; }
    .main { padding: 22px 16px 40px; }
    .form-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="mark">FIELD LEDGER</div>
      <h1>고객사 점검 관리</h1>
    </div>
    <nav class="tab-rail">
      <button class="tab-btn active" data-tab="map"><span class="num">01</span>지도</button>
      <button class="tab-btn" data-tab="month"><span class="num">02</span>이달의 방문</button>
      <button class="tab-btn" data-tab="manage"><span class="num">03</span>고객사 관리</button>
    </nav>
    <div class="sidebar-foot" id="sidebarFoot">0개 고객사 등록됨</div>
  </aside>

  <main class="main">
    <section id="panel-map" class="panel active">
      <div class="page-head">
        <h2>고객사 위치</h2>
        <span class="meta" id="mapMeta">0 SITES</span>
      </div>
      <div class="doc-card">
        <div id="map"></div>
        <div class="bl"></div><div class="br"></div>
      </div>
      <div class="map-legend">
        <span><span class="dot" style="background:#2B6E55"></span>월간 점검</span>
        <span><span class="dot" style="background:#93711E"></span>분기 점검</span>
        <span><span class="dot" style="background:#C1541E"></span>반기 점검</span>
      </div>
    </section>

    <section id="panel-month" class="panel">
      <div class="page-head">
        <h2>이달의 방문</h2>
        <span class="meta" id="monthMeta"></span>
      </div>
      <div class="month-picker">
        <button id="prevMonth">‹</button>
        <div class="month-label" id="monthLabel"></div>
        <button id="nextMonth">›</button>
      </div>
      <div id="visitList"></div>
    </section>

    <section id="panel-manage" class="panel">
      <div class="page-head">
        <h2>고객사 관리</h2>
        <span class="meta" id="manageMeta">0 RECORDS</span>
      </div>

      <details class="doc-card settings-card" id="settingsCard">
        <summary>지도 검색 설정 (선택)</summary>
        <div class="settings-body">
          <p class="settings-desc">카카오 지도 JavaScript 키를 등록하면 주소 자동 검색 정확도가 크게 올라가요. 비워두면 기본 검색(Nominatim)으로 동작해요.</p>
          <div class="row">
            <input type="text" id="fKakaoKey" placeholder="카카오 JavaScript 키 붙여넣기" />
            <button class="btn-outline" id="saveKakaoKeyBtn" type="button">저장</button>
          </div>
          <div class="settings-status" id="kakaoStatus"></div>
        </div>
        <div class="bl"></div><div class="br"></div>
      </details>

      <div class="doc-card form-card">
        <h3 id="formTitle">고객사 추가</h3>
        <div class="form-grid">
          <div class="field">
            <label>고객사명</label>
            <input type="text" id="fName" placeholder="예: 한빛물산" />
          </div>
          <div class="field">
            <label>점검 주기</label>
            <select id="fCycle">
              <option value="1">월간</option>
              <option value="3">분기</option>
              <option value="6">반기</option>
            </select>
          </div>
          <div class="field">
            <label>마지막 점검일</label>
            <input type="date" id="fLast" />
          </div>

          <div class="field full">
            <label>주소</label>
            <div class="row">
              <input type="text" id="fAddr" placeholder="예: 서울시 강남구 테헤란로 123" />
              <button class="btn-outline" id="findLocBtn" type="button">위치 확인</button>
            </div>
          </div>

          <div class="field full preview-wrap" id="previewWrap">
            <div class="preview-status" id="previewStatus"></div>
            <div id="previewMap"></div>
            <div class="preview-hint">핀을 드래그하면 위치를 조정할 수 있어요</div>
          </div>

          <div class="form-actions">
            <button class="btn-primary" id="submitBtn" disabled>추가하기</button>
            <button class="btn-text" id="cancelEditBtn" style="display:none;">취소</button>
            <span class="form-msg" id="formMsg"></span>
          </div>
        </div>
        <div class="bl"></div><div class="br"></div>
      </div>

      <div class="doc-card">
        <table class="client-table">
          <thead>
            <tr>
              <th style="width:34%">고객사</th>
              <th style="width:13%">주기</th>
              <th style="width:17%">마지막 점검</th>
              <th style="width:17%">다음 점검 예정</th>
              <th style="width:19%"></th>
            </tr>
          </thead>
          <tbody id="clientTableBody"></tbody>
        </table>
        <div class="bl"></div><div class="br"></div>
      </div>
    </section>
  </main>
</div>

<script>
(function () {
  const CYCLE_LABEL = { 1: '월간', 3: '분기', 6: '반기' };
  const CYCLE_CLASS = { 1: 'monthly', 3: 'quarterly', 6: 'biannual' };
  const CYCLE_COLOR = { 1: '#2B6E55', 3: '#93711E', 6: '#C1541E' };
  const KOREA_CENTER = [36.5, 127.8];

  let clients = [];
  let editingId = null;
  let map, markersLayer;
  let previewMap, previewMarker;
  let previewCoords = null;
  let viewMonth = new Date().getMonth();
  let viewYear = new Date().getFullYear();

  const $ = (sel) => document.querySelector(sel);
  const $$ = (sel) => document.querySelectorAll(sel);

  // ---------- storage (Claude 아티팩트 window.storage 우선, 없으면 localStorage) ----------
  const hasArtifactStorage = typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get === 'function';

  async function storeGet(key) {
    if (hasArtifactStorage) {
      try {
        const res = await window.storage.get(key, false);
        return res ? res.value : null;
      } catch (e) { return null; }
    }
    return localStorage.getItem(key);
  }
  async function storeSet(key, value) {
    if (hasArtifactStorage) {
      try { await window.storage.set(key, value, false); } catch (e) { console.error('저장 실패', e); }
      return;
    }
    try { localStorage.setItem(key, value); } catch (e) { console.error('저장 실패', e); }
  }

  async function loadClients() {
    const raw = await storeGet('clients');
    clients = raw ? JSON.parse(raw) : [];
  }
  async function saveClients() {
    await storeSet('clients', JSON.stringify(clients));
  }

  // ---------- kakao key ----------
  let kakaoKey = null;
  let kakaoReady = false;
  async function loadKakaoKey() {
    kakaoKey = await storeGet('kakaoKey');
    if (kakaoKey) {
      $('#fKakaoKey').value = kakaoKey;
      try { await loadKakaoSDK(kakaoKey); markKakaoStatus(true); }
      catch (e) { markKakaoStatus(false, '키가 등록되어 있지만 불러오지 못했어요. 도메인 등록을 확인해 주세요.'); }
    }
  }
  function markKakaoStatus(ok, customMsg) {
    const el = $('#kakaoStatus');
    if (ok) { el.textContent = '카카오 지도 연결됨 — 자동 검색이 더 정확해져요.'; el.className = 'settings-status ok'; }
    else { el.textContent = customMsg || '카카오 키가 등록되지 않았어요. 기본 검색으로 동작해요.'; el.className = 'settings-status warn'; }
  }
  function loadKakaoSDK(key) {
    return new Promise((resolve, reject) => {
      if (window.kakao && window.kakao.maps && window.kakao.maps.services) { kakaoReady = true; resolve(); return; }
      const script = document.createElement('script');
      script.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${encodeURIComponent(key)}&libraries=services&autoload=false`;
      script.onload = () => {
        try {
          window.kakao.maps.load(() => { kakaoReady = true; resolve(); });
        } catch (e) { reject(e); }
      };
      script.onerror = () => reject(new Error('sdk load failed'));
      document.head.appendChild(script);
    });
  }
  $('#saveKakaoKeyBtn').addEventListener('click', async () => {
    const val = $('#fKakaoKey').value.trim();
    if (!val) {
      kakaoKey = null; kakaoReady = false;
      await storeSet('kakaoKey', '');
      markKakaoStatus(false, '키를 비웠어요. 기본 검색으로 동작해요.');
      return;
    }
    $('#saveKakaoKeyBtn').textContent = '확인 중...';
    try {
      await loadKakaoSDK(val);
      kakaoKey = val;
      await storeSet('kakaoKey', val);
      markKakaoStatus(true);
    } catch (e) {
      markKakaoStatus(false, '연결에 실패했어요. 키가 맞는지, 이 사이트 도메인이 카카오 디벨로퍼스에 등록되어 있는지 확인해 주세요.');
    }
    $('#saveKakaoKeyBtn').textContent = '저장';
  });

  // ---------- date helpers ----------
  function nextDueDate(lastStr, cycleMonths, from = new Date()) {
    const last = new Date(lastStr);
    const lastTotal = last.getFullYear() * 12 + last.getMonth();
    const fromTotal = from.getFullYear() * 12 + from.getMonth();
    let diff = fromTotal - lastTotal;
    let add;
    if (diff <= 0) { add = -diff; }
    else { const rem = diff % cycleMonths; add = rem === 0 ? 0 : cycleMonths - rem; }
    const totalMonths = fromTotal + add;
    const y = Math.floor(totalMonths / 12);
    const m = totalMonths % 12;
    return new Date(y, m, Math.min(last.getDate(), 28));
  }
  function isDueInMonth(lastStr, cycleMonths, year, month) {
    const last = new Date(lastStr);
    const lastTotal = last.getFullYear() * 12 + last.getMonth();
    const targetTotal = year * 12 + month;
    const diff = targetTotal - lastTotal;
    return diff >= 0 && diff % cycleMonths === 0;
  }
  function fmtDate(d) {
    return `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')}`;
  }

  // ---------- geocoding with fallback ----------
  function geocodeKakaoOnce(q) {
    return new Promise((resolve) => {
      if (!kakaoReady) { resolve(null); return; }
      const geocoder = new kakao.maps.services.Geocoder();
      geocoder.addressSearch(q, (result, status) => {
        if (status === kakao.maps.services.Status.OK && result.length) {
          resolve({ lat: parseFloat(result[0].y), lng: parseFloat(result[0].x) });
        } else {
          resolve(null);
        }
      });
    });
  }

  async function geocodeOnce(q) {
    const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=kr&q=${encodeURIComponent(q)}`;
    const res = await fetch(url, { headers: { 'Accept-Language': 'ko' } });
    if (!res.ok) return null;
    const data = await res.json();
    if (!data.length) return null;
    return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
  }

  async function geocodeWithFallback(address) {
    const attempts = [address];
    const noParen = address.replace(/\(.*?\)/g, '').trim();
    if (noParen && noParen !== address) attempts.push(noParen);
    const noSuite = noParen.replace(/\s*[\d]+\s*(층|호|동)\s*$/u, '').trim();
    if (noSuite && noSuite !== noParen) attempts.push(noSuite);
    const parts = noSuite.split(/\s+/);
    if (parts.length > 2) attempts.push(parts.slice(0, -1).join(' '));

    // 카카오 지도가 연결돼 있으면 먼저 시도 (한국 주소 정확도가 더 높음)
    if (kakaoReady) {
      for (const a of attempts) {
        const r = await geocodeKakaoOnce(a);
        if (r) return { coords: r, matched: true, source: 'kakao' };
      }
    }
    // 기본 검색(Nominatim) 폴백
    for (const a of attempts) {
      try {
        const r = await geocodeOnce(a);
        if (r) return { coords: r, matched: true, source: 'nominatim' };
      } catch (e) { /* try next */ }
    }
    return { coords: null, matched: false };
  }

  // ---------- tabs ----------
  $$('.tab-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      $$('.tab-btn').forEach((b) => b.classList.remove('active'));
      $$('.panel').forEach((p) => p.classList.remove('active'));
      btn.classList.add('active');
      $('#panel-' + btn.dataset.tab).classList.add('active');
      if (btn.dataset.tab === 'map') setTimeout(() => map && map.invalidateSize(), 50);
    });
  });

  // ---------- main map ----------
  function initMap() {
    map = L.map('map').setView(KOREA_CENTER, 7);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors', maxZoom: 19,
    }).addTo(map);
    markersLayer = L.layerGroup().addTo(map);
  }
  function renderMap() {
    markersLayer.clearLayers();
    const pts = [];
    clients.forEach((c) => {
      if (c.lat == null || c.lng == null) return;
      pts.push([c.lat, c.lng]);
      const marker = L.circleMarker([c.lat, c.lng], {
        radius: 8, color: '#fff', weight: 2, fillColor: CYCLE_COLOR[c.cycle], fillOpacity: 1,
      }).addTo(markersLayer);
      const due = fmtDate(nextDueDate(c.lastInspection, c.cycle));
      marker.bindPopup(`<b>${escapeHtml(c.name)}</b><br>${escapeHtml(c.address)}<br>${CYCLE_LABEL[c.cycle]} 점검 · 다음: ${due}`);
    });
    if (pts.length) map.fitBounds(pts, { padding: [30, 30], maxZoom: 12 });
    $('#mapMeta').textContent = `${pts.length} / ${clients.length} SITES MAPPED`;
  }
  function escapeHtml(s) {
    const d = document.createElement('div'); d.textContent = s; return d.innerHTML;
  }

  // ---------- preview map (location confirm) ----------
  function ensurePreviewMap(lat, lng) {
    if (!previewMap) {
      previewMap = L.map('previewMap').setView([lat, lng], 15);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors', maxZoom: 19,
      }).addTo(previewMap);
      previewMarker = L.marker([lat, lng], { draggable: true }).addTo(previewMap);
      previewMarker.on('dragend', () => {
        const p = previewMarker.getLatLng();
        previewCoords = { lat: p.lat, lng: p.lng };
        $('#submitBtn').disabled = false;
      });
    } else {
      previewMap.setView([lat, lng], 15);
      previewMarker.setLatLng([lat, lng]);
      setTimeout(() => previewMap.invalidateSize(), 50);
    }
  }

  $('#findLocBtn').addEventListener('click', async () => {
    const address = $('#fAddr').value.trim();
    const status = $('#previewStatus');
    if (!address) { status.textContent = '먼저 주소를 입력해 주세요.'; status.className = 'preview-status warn'; return; }

    $('#findLocBtn').disabled = true;
    $('#findLocBtn').textContent = '찾는 중...';
    $('#previewWrap').classList.add('show');
    status.textContent = '주소를 검색하고 있어요...';
    status.className = 'preview-status';

    const { coords, matched } = await geocodeWithFallback(address);
    const finalCoords = coords || { lat: KOREA_CENTER[0], lng: KOREA_CENTER[1] };
    previewCoords = finalCoords;

    setTimeout(() => ensurePreviewMap(finalCoords.lat, finalCoords.lng), 30);

    if (matched) {
      status.textContent = '위치를 찾았어요. 정확한지 확인하고, 다르면 핀을 드래그해서 옮겨 주세요.';
      status.className = 'preview-status ok';
      if (!previewMap) setTimeout(() => previewMap && previewMap.setZoom(16), 100);
    } else {
      status.textContent = '정확한 위치를 찾지 못했어요. 지도를 이동하고 핀을 드래그해서 직접 지정해 주세요.';
      status.className = 'preview-status warn';
    }

    $('#findLocBtn').disabled = false;
    $('#findLocBtn').textContent = '다시 확인';
    $('#submitBtn').disabled = false;
  });

  // ---------- month panel ----------
  function renderMonth() {
    $('#monthLabel').textContent = `${viewYear}년 ${viewMonth + 1}월`;
    const due = clients
      .filter((c) => isDueInMonth(c.lastInspection, c.cycle, viewYear, viewMonth))
      .sort((a, b) => a.name.localeCompare(b.name));
    $('#monthMeta').textContent = `${due.length} DUE`;

    const list = $('#visitList');
    if (!due.length) {
      list.innerHTML = `<div class="empty-state">이 달에 예정된 점검이 없습니다.</div>`;
      return;
    }
    list.innerHTML = due.map((c) => {
      const d = nextDueDate(c.lastInspection, c.cycle, new Date(viewYear, viewMonth, 1));
      return `
      <div class="visit-row">
        <div class="name">${escapeHtml(c.name)}</div>
        <span class="badge ${CYCLE_CLASS[c.cycle]}">${CYCLE_LABEL[c.cycle]}</span>
        <span class="due-date">${fmtDate(d)}</span>
        <div class="addr">${escapeHtml(c.address)}</div>
      </div>`;
    }).join('');
  }
  $('#prevMonth').addEventListener('click', () => { viewMonth--; if (viewMonth < 0) { viewMonth = 11; viewYear--; } renderMonth(); });
  $('#nextMonth').addEventListener('click', () => { viewMonth++; if (viewMonth > 11) { viewMonth = 0; viewYear++; } renderMonth(); });

  // ---------- manage panel ----------
  function renderTable() {
    const body = $('#clientTableBody');
    if (!clients.length) {
      body.innerHTML = `<tr><td colspan="5"><div class="empty-state">등록된 고객사가 없습니다. 위에서 추가해 주세요.</div></td></tr>`;
      $('#manageMeta').textContent = '0 RECORDS';
      $('#sidebarFoot').textContent = '0개 고객사 등록됨';
      return;
    }
    $('#manageMeta').textContent = `${clients.length} RECORDS`;
    $('#sidebarFoot').textContent = `${clients.length}개 고객사 등록됨`;
    body.innerHTML = clients.slice().sort((a, b) => a.name.localeCompare(b.name)).map((c) => {
      const due = fmtDate(nextDueDate(c.lastInspection, c.cycle));
      return `
      <tr data-id="${c.id}">
        <td>
          <div class="row-name">${escapeHtml(c.name)}</div>
          <div class="row-addr">${escapeHtml(c.address)}${c.lat == null ? ' (위치 미확인)' : ''}</div>
        </td>
        <td><span class="badge ${CYCLE_CLASS[c.cycle]}">${CYCLE_LABEL[c.cycle]}</span></td>
        <td>${fmtDate(new Date(c.lastInspection))}</td>
        <td>${due}</td>
        <td>
          <button class="icon-btn edit" data-action="edit">수정</button>
          <button class="icon-btn" data-action="delete">삭제</button>
        </td>
      </tr>`;
    }).join('');
  }

  $('#clientTableBody').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-action]');
    if (!btn) return;
    const tr = e.target.closest('tr');
    const id = tr.dataset.id;
    if (btn.dataset.action === 'delete') {
      if (confirm('이 고객사를 삭제할까요?')) {
        clients = clients.filter((c) => c.id !== id);
        saveClients(); renderAll();
      }
    } else if (btn.dataset.action === 'edit') {
      startEdit(id);
    }
  });

  function startEdit(id) {
    const c = clients.find((c) => c.id === id);
    if (!c) return;
    editingId = id;
    $('#fName').value = c.name;
    $('#fAddr').value = c.address;
    $('#fCycle').value = c.cycle;
    $('#fLast').value = c.lastInspection;
    $('#formTitle').textContent = '고객사 수정';
    $('#submitBtn').textContent = '수정 완료';
    $('#cancelEditBtn').style.display = 'inline-block';

    if (c.lat != null && c.lng != null) {
      previewCoords = { lat: c.lat, lng: c.lng };
      $('#previewWrap').classList.add('show');
      $('#previewStatus').textContent = '등록된 위치입니다. 필요하면 핀을 옮겨 조정하세요.';
      $('#previewStatus').className = 'preview-status ok';
      setTimeout(() => ensurePreviewMap(c.lat, c.lng), 30);
      $('#submitBtn').disabled = false;
    } else {
      previewCoords = null;
      $('#previewWrap').classList.remove('show');
      $('#submitBtn').disabled = true;
    }
    $('#panel-manage').scrollIntoView({ behavior: 'smooth' });
  }

  function resetForm() {
    editingId = null;
    $('#fName').value = ''; $('#fAddr').value = ''; $('#fCycle').value = '1'; $('#fLast').value = '';
    $('#formTitle').textContent = '고객사 추가';
    $('#submitBtn').textContent = '추가하기';
    $('#submitBtn').disabled = true;
    $('#cancelEditBtn').style.display = 'none';
    $('#formMsg').textContent = ''; $('#formMsg').classList.remove('error');
    $('#previewWrap').classList.remove('show');
    $('#findLocBtn').textContent = '위치 확인';
    previewCoords = null;
  }
  $('#cancelEditBtn').addEventListener('click', resetForm);

  $('#submitBtn').addEventListener('click', async () => {
    const name = $('#fName').value.trim();
    const address = $('#fAddr').value.trim();
    const cycle = parseInt($('#fCycle').value, 10);
    const last = $('#fLast').value;
    const msg = $('#formMsg');

    if (!name || !address || !last || !previewCoords) {
      msg.textContent = '고객사명, 주소, 마지막 점검일을 입력하고 위치를 확인해 주세요.';
      msg.classList.add('error');
      return;
    }
    msg.textContent = ''; msg.classList.remove('error');

    if (editingId) {
      const c = clients.find((c) => c.id === editingId);
      c.name = name; c.address = address; c.cycle = cycle; c.lastInspection = last;
      c.lat = previewCoords.lat; c.lng = previewCoords.lng;
    } else {
      clients.push({
        id: 'c_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
        name, address, cycle, lastInspection: last,
        lat: previewCoords.lat, lng: previewCoords.lng,
      });
    }
    await saveClients();
    resetForm();
    renderAll();
  });

  // ---------- render all ----------
  function renderAll() { renderMap(); renderMonth(); renderTable(); }

  // ---------- init ----------
  (async function init() {
    initMap();
    await loadClients();
    renderAll();
    loadKakaoKey();
  })();
})();
</script>
</body>
</html>
